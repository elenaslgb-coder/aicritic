<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-критик бизнес-идеи</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #171717;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 20px;
      color: #666;
      line-height: 1.5;
    }

    .form {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 18px;
      font-size: 17px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #666;
    }

    .results {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,.06);
    }

    .card h2 {
      font-size: 20px;
      margin-top: 0;
    }

    .card li {
      margin-bottom: 12px;
      line-height: 1.45;
    }

    @media (max-width: 750px) {
      h1 {
        font-size: 36px;
      }

      .results {
        grid-template-columns: 1fr;
      }

      .container {
        padding-top: 35px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>Проверь свою бизнес-идею</h1>

    <div class="subtitle">
      AI-критик в роли венчурного инвестора разберёт идею:
      сильные стороны, слабые места и вопросы инвестора.
    </div>
  </div>

  <div class="form">

    <textarea
      id="idea"
      placeholder="Опишите вашу бизнес-идею..."
    ></textarea>

    <button id="analyzeButton" onclick="analyzeIdea()">
      Получить разбор
    </button>

    <div id="status"></div>

  </div>

  <div class="results" id="results">

    <div class="card">
      <h2>Сильные стороны</h2>
      <ul id="strengths"></ul>
    </div>

    <div class="card">
      <h2>Слабые места</h2>
      <ul id="weaknesses"></ul>
    </div>

    <div class="card">
      <h2>Вопросы инвестора</h2>
      <ul id="questions"></ul>
    </div>

  </div>

</div>

<script>

async function analyzeIdea() {

  const idea = document.getElementById("idea").value.trim();
  const status = document.getElementById("status");
  const button = document.getElementById("analyzeButton");

  if (!idea) {
    status.textContent = "Сначала опишите вашу бизнес-идею.";
    return;
  }

  status.textContent = "AI анализирует идею...";
  button.disabled = true;

  document.getElementById("results").style.display = "none";

  try {

    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ idea })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    fillList("strengths", data.strengths);
    fillList("weaknesses", data.weaknesses);
    fillList("questions", data.questions);

    document.getElementById("results").style.display = "grid";

    status.textContent = "";

  } catch (error) {

    status.textContent =
      "Не удалось получить разбор. Попробуйте ещё раз.";

    console.error(error);

  } finally {

    button.disabled = false;

  }
}

function fillList(id, items) {

  const list = document.getElementById(id);

  list.innerHTML = "";

  (items || []).forEach(item => {

    const li = document.createElement("li");

    li.textContent = item;

    list.appendChild(li);

  });
}

</script>

</body>
</html>
